    <style>
      /* ===== 自定样式 ===== */
      
      /* 0. 引入自定义字体 */
      @font-face {
        font-family: 'ZiHunBianTaoTi';
        src: url('./css/fonts/ZiHunBianTaoTi-2.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      /* 1. 电脑端：上标题 */
      .welcome-area .header-text h1 {
        font-size: 75px !important; 
        line-height: 1.4 !important;
        font-family: 'ZiHunBianTaoTi', 'Microsoft YaHei', sans-serif !important; 
      }
      
      /* 2. 电脑端：小标题 */
      .welcome-area .header-text p {
        font-size: 50px !important; 
        line-height: 1.4 !important;
        font-family: "Microsoft YaHei", "微软雅黑", sans-serif !important;
        font-weight: bold !important;
      }

      /* 3. 电脑端：左上角图片 */
      .top-left-image {
        position: absolute;
        top: 30px;
        left: 30px;
        z-index: 999;
        width: 80px;
        height: auto;
      }

      /* ===== 手机端彻底修复 (屏幕宽度小于 765px) ===== */
      @media (max-width: 765px) {
        /* 1. 左上角图片缩小 */
        .top-left-image { width: 40px; top: 15px; left: 15px; }
        
        /* 2. 顶部大标题减小 */
        .welcome-area .header-text h1 { font-size: 32px !important; line-height: 1.4 !important; }
        
        /* 3. 顶部小标题减小 */
        .welcome-area .header-text p { font-size: 20px !important; line-height: 1.4 !important; }
        
        /* 4. 大幅度缩短头图高度 */
        .welcome-area {
          min-height: 280px !important; 
          height: auto !important;
          padding-top: 60px !important;
          padding-bottom: 10px !important;
          background-size: cover !important;
          background-position: center top !important;
        }

        /* 5. 强行干掉下方所有可能产生空白的多余高度 (关键修复) */
        .section.home-feature {
          display: block !important;
          visibility: visible !important;
          opacity: 1 !important;
          padding-top: 10px !important;
          padding-bottom: 10px !important;
          min-height: 0 !important;  /* 干掉多余的最小高度 */
          height: auto !important;   /* 干掉被撑开的高度 */
        }
        
        /* 针对原模板可能存在的紫色大背景块，强行砍掉其高度 */
        .section.home-feature .container, 
        .section.home-feature .row,
        .section.home-feature .col-lg-12 {
          height: auto !important;
          min-height: 0 !important;
          padding-top: 0 !important;
          padding-bottom: 0 !important;
        }

        /* 6. 核心：让三个框在手机端变成一栏（垂直排列）并紧凑 */
        .section.home-feature .row > div {
          width: 100% !important;
          flex: 0 0 100% !important;
          max-width: 100% !important;
          margin-bottom: 10px !important; /* 缩小框的间距 */
        }
        
        /* 7. 缩小卡片内边距 */
        .features-small-item {
          display: block !important;
          visibility: visible !important;
          opacity: 1 !important;
          padding: 12px 10px !important;
          text-align: center !important;
          border-radius: 10px !important;
        }

        /* 8. 缩小图标和标题 */
        .features-small-item .icon img { width: 35px !important; height: auto !important; }
        .features-small-item .features-title {
          font-size: 16px !important;
          margin-top: 5px !important;
          margin-bottom: 8px !important;
        }

        /* 9. 优化按钮 */
        .features-small-item .btn {
          width: 80% !important;     
          padding: 8px 0 !important;
          font-size: 14px !important;
          margin-top: 0 !important;
        }
        
        /* 10. 页脚紧凑 */
        footer { position: relative !important; margin-top: 10px !important; }
      }

      /* 4. 页脚说明文字 */
      footer .footer-note {
        color: #fff;
        text-align: center;
        font-size: 14px;
        letter-spacing: 0.5px;
        margin: 0;
        padding: 20px 15px 30px;
        opacity: 0.92;
      }
    </style>
