<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="网页整理汇总平台｜语文课下注释/理解性默写">
    <meta name="keywords" content="语文,理解性默写,课下注释">
    <meta name="author" content="elemis">
    <title>网页整理汇总平台</title>
    <!-- Bootstrap 5 CSS 内联 -->
    <style>
        :root{--primary:#7c4dff;}
        *,::after,::before{box-sizing:border-box}
        html{scroll-behavior:smooth}
        body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#333;background:#fff}
        .container{width:100%;padding-right:15px;padding-left:15px;margin-right:auto;margin-left:auto;max-width:1140px}
        .row{display:flex;flex-wrap:wrap;margin-right:-15px;margin-left:-15px}
        .col-12{flex:0 0 auto;width:100%;padding:0 15px}
        @media (min-width:576px){.col-sm-6{flex:0 0 50%;max-width:50%;padding:0 15px}}
        @media (min-width:768px){.col-md-6{flex:0 0 50%;max-width:50%;padding:0 15px}}
        @media (min-width:992px){.col-lg-4{flex:0 0 33.333333%;max-width:33.333333%;padding:0 15px}}
        @media (min-width:1200px){
            .offset-xl-3{margin-left:25%}
            .col-xl-6{flex:0 0 50%;max-width:50%;padding:0 15px}
        }
        .welcome-area{background-color:#7c4dff;color:#fff;padding:80px 0;text-align:center}
        .section{padding:60px 0}
        .features-small-item{
            background:#fff;
            box-shadow:0 2px 12px rgba(0,0,0,0.08);
            border-radius:8px;
            padding:32px 20px;
            min-height:240px;
            display:flex !important;
            flex-direction:column !important;
            align-items:center !important;
            justify-content:center !important;
            text-align:center !important;
            margin-bottom:24px;
        }
        .features-small-item .icon{
            width:60px;height:60px;
            background:#f3e5ff;
            border-radius:50%;
            display:flex;align-items:center;justify-content:center;
            font-size:28px;color:#7c4dff;
            margin:0 0 18px 0;
        }
        .features-title{
            font-size:18px;
            margin:0 0 20px 0;
            font-weight:600;
        }
        .btn{
            display:inline-block;
            font-weight:400;
            text-align:center;
            text-decoration:none;
            vertical-align:middle;
            cursor:pointer;
            border:1px solid transparent;
            border-radius:0.375rem;
            padding:0.25rem 0.75rem;
            font-size:0.875rem;
        }
        .btn-primary{
            color:#fff;
            background-color:#7c4dff;
            border-color:#7c4dff;
        }
        .btn-primary:hover{background-color:#651fff;border-color:#651fff;color:#fff}
        footer{padding:30px 0;background:#f7f7f7;margin-top:20px}
    </style>
</head>
<body>
<div class="welcome-area">
    <div class="header-text">
        <div class="container">
            <div class="row">
                <div class="offset-xl-3 col-xl-6 col-lg-8 col-md-12 col-sm-12">
                    <h1>网页整理汇总平台</h1>
                    <p>语文课下注释/理解性默写</p>
                </div>
            </div>
        </div>
    </div>
</div>

<section class="section">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="row">
                    <div class="col-lg-4 col-md-6 col-sm-6 col-12">
                        <div class="features-small-item">
                            <div class="icon">
                                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7c4dff" stroke-width="2">
                                    <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                                    <path d="M2 17l10 5 10-5"></path>
                                    <path d="M2 12l10 5 10-5"></path>
                                </svg>
                            </div>
                            <h5 class="features-title">语文理解性默写</h5>
                            <a href="https://king-aoto.github.io/lijiemoxie/" target="_blank" class="btn btn-primary">点击跳转</a>
                        </div>
                    </div>

                    <div class="col-lg-4 col-md-6 col-sm-6 col-12">
                        <div class="features-small-item">
                            <div class="icon">
                                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7c4dff" stroke-width="2">
                                    <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                                    <path d="M2 17l10 5 10-5"></path>
                                    <path d="M2 12l10 5 10-5"></path>
                                </svg>
                            </div>
                            <h5 class="features-title">语文课下注释</h5>
                            <a href="https://mz09.dpdns.org" target="_blank" class="btn btn-primary">点击跳转</a>
                        </div>
                    </div>

                    <div class="col-lg-4 col-md-6 col-sm-6 col-12">
                        <div class="features-small-item">
                            <div class="icon">
                                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7c4dff" stroke-width="2">
                                    <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                                    <path d="M2 17l10 5 10-5"></path>
                                    <path d="M2 12l10 5 10-5"></path>
                                </svg>
                            </div>
                            <h5 class="features-title">预留入口</h5>
                            <p>暂不开放</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<footer>
    <div class="container">
        <div class="row">
            <div class="col-lg-12 col-md-12 col-sm-12"></div>
        </div>
    </div>
</footer>

<!-- 无需外部JS，交互全部CSS完成 -->
</body>
</html>
